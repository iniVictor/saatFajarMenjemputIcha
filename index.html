<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta name="theme-color" content="#f4ebe0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      window.__GUEST_LOOKUP_TOKEN__ = "";
      window.__GUEST_LOOKUP__ = null;
      try {
        if (window.location.hostname === "undanganfajaricha.online") {
          window.location.replace(
            "https://www.undanganfajaricha.online" +
              window.location.pathname +
              window.location.search +
              window.location.hash,
          );
        }
        var screenW = Math.min(screen.width || 0, screen.height || 0);
        if (screenW && screenW <= 520 && window.innerWidth > screenW + 40) {
          var viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) {
            viewport.setAttribute(
              "content",
              "width=" + screenW + ", initial-scale=1, maximum-scale=1, viewport-fit=cover",
            );
          }
        }
        var path = window.location.pathname.replace(/\/+$/, "") || "/";
        if (path !== "/kirimUndangan") {
          var preload = document.createElement("link");
          preload.rel = "preload";
          preload.as = "image";
          preload.type = "image/webp";
          preload.href = "/images/cover.webp";
          preload.fetchPriority = "high";
          document.head.appendChild(preload);
        }
        var token = new URLSearchParams(window.location.search).get("g");
        if (token) {
          window.__GUEST_LOOKUP_TOKEN__ = token;
          window.__GUEST_LOOKUP__ = fetch("/api/guests?g=" + encodeURIComponent(token), {
            headers: { Accept: "application/json" },
            priority: "high",
          })
            .then(function (res) {
              return res.ok ? res.json() : null;
            })
            .catch(function () {
              return null;
            });
        }
      } catch (e) {}
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Great+Vibes&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>The Wedding of Icha &amp; Fajar</title>
    <meta name="description" content="Our wedding invitation." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
